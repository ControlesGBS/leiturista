<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meu painel — GBS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#f4f4f2; --card-bg:#fff; --card-border:#e0e0e0;
  --texto:#1a2a1a; --texto-suave:#5a7a5a; --texto-fraco:#8a9a8a;
  --track-bg:#e8e8e6; --azul-topo:#0f4c86;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181a; --card-bg:#1d2422; --card-border:#2c3532;
    --texto:#e8ece8; --texto-suave:#9ab0a0; --texto-fraco:#6f8478;
    --track-bg:#2a332f;
  }
}
:root[data-tema="escuro"]{
  --bg:#14181a; --card-bg:#1d2422; --card-border:#2c3532;
  --texto:#e8ece8; --texto-suave:#9ab0a0; --texto-fraco:#6f8478;
  --track-bg:#2a332f;
}
:root[data-tema="claro"]{
  --bg:#f4f4f2; --card-bg:#fff; --card-border:#e0e0e0;
  --texto:#1a2a1a; --texto-suave:#5a7a5a; --texto-fraco:#8a9a8a;
  --track-bg:#e8e8e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);min-height:100vh}

.wrap{max-width:460px;width:100%;margin:0 auto;padding:0 14px 20px}

.topo{background:var(--azul-topo);border-radius:0 0 16px 16px;padding:16px 16px 18px;margin-bottom:12px}
.topo-linha{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topo-perfil{display:flex;align-items:center;gap:12px}
.btn-menu{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0}
.topo-acoes{display:flex;align-items:center;gap:8px;flex-shrink:0}
.alertas-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.alertas-label{font-size:9px;font-weight:700;color:#ff5252;letter-spacing:.05em;visibility:hidden}
.alertas-label.piscando{visibility:visible;animation:piscaAlerta 1s steps(1) infinite}
@keyframes piscaAlerta{0%,49%{opacity:1}50%,100%{opacity:0}}
.btn-alertas{position:relative;background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;flex-shrink:0}
.btn-alertas.tem-alerta{background:#c0392b;animation:pulsoAlerta 1.8s infinite}
.alertas-badge{position:absolute;top:-4px;right:-4px;background:#c0392b;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--azul-topo)}
@keyframes pulsoAlerta{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}70%{box-shadow:0 0 0 7px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
.alerta-item{display:flex;gap:10px;padding:12px 0;border-top:0.5px solid var(--card-border)}
.alerta-item:first-child{border-top:none}
.alerta-icone{font-size:18px;flex-shrink:0}
.alerta-texto{font-size:13px;color:var(--texto);line-height:1.45}
.alerta-texto b{font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:#fff;flex-shrink:0}
.saudacao{font-size:12px;color:rgba(255,255,255,.75);margin:0}
.nome{font-size:16px;font-weight:500;color:#fff;margin:2px 0 0}
.funcao-base{font-size:12px;color:rgba(255,255,255,.75);margin:2px 0 0}

.menu-drop{background:var(--card-bg);border:0.5px solid var(--card-border);border-radius:10px;padding:6px;margin:8px 0 0;display:none}
.menu-drop button{width:100%;text-align:left;background:none;border:none;color:var(--texto);font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu-drop button:active{background:var(--track-bg)}

.data-hora{background:var(--card-bg);border:0.5px solid var(--card-border);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--texto)}
.data-hora .hora{font-weight:500;font-size:14px}

.sec-titulo{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:14px;font-weight:500;color:var(--texto)}

.tile-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:16px}
.tile{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:10px;padding:10px 4px;text-align:center}
.tile-num{font-size:18px;font-weight:600;margin:0}
.tile-lbl{font-size:10.5px;color:var(--texto-suave);margin:3px 0 0}
.tile.clicavel{cursor:pointer}
.tile.sel{border-color:var(--tile-cor,#0f4c86);border-width:2px}

.cat-card{background:var(--card-bg);border:0.5px solid var(--card-border);border-radius:12px;padding:14px;margin-bottom:12px}
.cat-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cat-titulo{font-size:13px;font-weight:500;color:var(--texto);flex:1}
.btn-ver{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--azul-topo);background:none;border:none;padding:2px;cursor:pointer}
.btn-ver .chev{display:inline-block;transition:transform .15s}

.tabela-wrap{margin-top:10px;overflow-x:auto;border-top:0.5px solid var(--card-border);padding-top:10px}
.tabela-wrap table{border-collapse:collapse;font-size:11.5px;white-space:nowrap;color:var(--texto)}
.tabela-wrap th{text-align:left;color:var(--texto-suave);font-weight:500;padding:2px 10px 6px 0}
.tabela-wrap td{padding:5px 10px 5px 0;border-top:0.5px solid var(--card-border)}

.chart-card{background:var(--card-bg);border:0.5px solid var(--card-border);border-radius:12px;padding:14px 16px 8px;margin-bottom:14px}
.chart-titulo{font-size:12px;color:var(--texto-suave);margin:0}
.chart-titulo b{color:var(--texto);font-weight:500}

.status-msg{text-align:center;color:var(--texto-suave);font-size:13px;padding:40px 0}

/* ── Premiação (painel de nível antigo) ─────────────────────────────── */
.topo-premiacao{display:flex;align-items:center;gap:10px;padding:14px 2px}
.btn-voltar{background:none;border:1px solid var(--card-border);color:var(--texto);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px}
.titulo-premiacao{font-size:15px;font-weight:500;color:var(--texto)}
.card{background:var(--card-bg);border-radius:14px;border:0.5px solid var(--card-border);padding:24px 24px 14px;margin-bottom:14px}
.nivel-box{border-radius:10px;padding:14px 16px;margin-bottom:22px}
.nivel-box p{margin:0 0 5px;font-size:17px;text-align:center}
.nivel-box p:last-child{margin-bottom:0}
.mes-titulo{font-size:17px;font-weight:500;margin:0 0 6px;color:var(--texto);text-align:left}
.mes-sub{font-size:16px;color:var(--texto-suave);margin:0 0 28px;line-height:1.5;text-align:left}
.bar-linha{margin-bottom:60px}
.bar-linha p{margin:0 0 14px;text-align:left}
.bar-valor{font-size:15px;font-weight:500;color:var(--texto)}
.bar-label{font-size:14px;color:var(--texto-suave)}
.bar-track{position:relative;height:8px;background:var(--track-bg);border-radius:4px;margin:0 9px 26px}
.bar-fill{position:absolute;left:0;top:0;height:8px;border-radius:4px;transition:background .2s}
.bar-medalha{position:absolute;top:50%;transform:translate(-50%,-50%)}
.bar-num{position:absolute;top:16px;font-size:14px;color:var(--texto-suave);transform:translateX(-50%)}
.bar-qtd{font-size:12px;color:var(--texto-fraco)}
</style>
</head>
<body>

<div class="wrap" id="tela-dashboard">
  <div class="topo">
    <div class="topo-linha">
      <div class="topo-perfil">
        <div class="avatar" id="avatar">--</div>

          <p class="saudacao" id="saudacao">Olá!</p>
          <p class="nome" id="topo-nome">—</p>

            <span class="alertas-badge" id="alertas-badge">0</span>

</div>

<div class="wrap" id="tela-premiacao" style="display:none">
  <div class="topo-premiacao">
    <button class="btn-voltar" onclick="fecharPremiacao()" aria-label="Voltar">&#8592;</button>
    <span class="titulo-premiacao">Premiação</span>
  </div>
  <div id="conteudo-premiacao" class="status-msg">Carregando...</div>
</div>

<script>
const SUPABASE_URL='https://ndwivbhqglpnfyqwjbzu.supabase.co';
const SUPABASE_KEY='sb_publishable_IhuNziyT5VYrMKRixcPGjA_LAn5ku-7';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ── Tema claro/escuro ────────────────────────────────────────────────
function aplicarTema(tema){
  document.documentElement.setAttribute('data-tema',tema);
  localStorage.setItem('leiturista-tema',tema);
}
function alternarTema(){
  const atual=document.documentElement.getAttribute('data-tema')||'claro';
  aplicarTema(atual==='escuro'?'claro':'escuro');
}
(function initTema(){
  const salvo=localStorage.getItem('leiturista-tema');
  const prefereEscuro=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  aplicarTema(salvo||(prefereEscuro?'escuro':'claro'));
})();

async function sair(){await sb.auth.signOut();location.href='login.html';}

function toggleMenu(){
  const el=document.getElementById('menu-drop');
  el.style.display=el.style.display==='none'||!el.style.display?'block':'none';
}

// ── Classificação de rota em 3 baldes (mesma regra do painel: 1-79 Urbano,
// 80-88 Povoado, 89-99 Rural — 95/96 contam como Rural aqui de propósito) ──
function bucketLeiturista(rota){
  const v=parseInt(rota)||0;
  if(v>=1&&v<=79) return 'urbano';
  if(v>=80&&v<=88) return 'povoado';
  return 'rural';
}
function rotaDoUl(ul){ return ul?ul.slice(6):null; }
function toMin(hhmm){ if(!hhmm) return 0; const p=hhmm.split(':').map(Number); return (p[0]||0)*60+(p[1]||0); }

let MATRICULA=null, MES_REF=null;
let ALERTAS_ATUAIS=[];

function ontemStr(){
  const d=new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Alertas: erro de leitura e reclamação (mês atual) ───────────────────
async function buscarAlertasErrosReclamacoes(){
  const [errRows, reclRows] = await Promise.all([
    sb.from('erros').select('ul,instalacao').ilike('matricula',MATRICULA).eq('mes_erro',MES_REF),
    sb.from('reclamacoes').select('instalacao,data,motivo').ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
  ]);
  const alertas=[];
  (errRows.data||[]).forEach(r=>{
    alertas.push({chave:`erro:${r.ul||''}:${r.instalacao||''}`, icone:'&#10060;',
      texto:`<b>1 erro de leitura:</b> UL ${r.ul||'—'}, Instalação ${r.instalacao||'—'}. Procure o Supervisor para mais informações do erro.`});
  });
  (reclRows.data||[]).forEach(r=>{
    alertas.push({chave:`reclamacao:${r.instalacao||''}:${r.data||''}`, icone:'&#128172;',
      texto:`<b>1 reclamação:</b> Instalação ${r.instalacao||'—'}, motivo: ${r.motivo||'—'}. Procure o Supervisor para mais informações dessa reclamação.`});
  });
  return alertas;
}

// ── Alertas: horário fora da faixa e falta de intervalo ──────────────────
// Os dados são atualizados à noite, então o leiturista só vê o de um dia no
// dia seguinte -- mas o alerta continua aparecendo (varre o mês inteiro até
// ontem) até ele realmente abrir e a tela marcar como lido, mesmo que ele só
// entre no app dias depois.
async function buscarAlertasHorarioIntervalo(){
  const dataOntem=ontemStr();
  const {data:linhas}=await sb.from('jornada').select('data,hora_inicial,hora_final,horas_json,qtd_leituras')
    .ilike('matricula',MATRICULA).eq('mes_ref',MES_REF).lte('data',dataOntem);
  if(!linhas||!linhas.length) return [];

  const porDia={};
  linhas.forEach(r=>{
    if(!porDia[r.data]) porDia[r.data]={horaIni:null,horaFim:null,totalLeit:0,todasHoras:[]};
    const d=porDia[r.data];
    d.totalLeit+=r.qtd_leituras||0;
    if(r.hora_inicial && (!d.horaIni||r.hora_inicial<d.horaIni)) d.horaIni=r.hora_inicial;
    if(r.hora_final && (!d.horaFim||r.hora_final>d.horaFim)) d.horaFim=r.hora_final;
    try{ d.todasHoras=d.todasHoras.concat(JSON.parse(r.horas_json||'[]')); }catch(e){}
  });

  const alertas=[];
  Object.entries(porDia).forEach(([data,d])=>{
    if(d.totalLeit<10) return; // dia sem trabalho relevante, não gera alerta
    const dataFmt=new Date(data+'T12:00:00').toLocaleDateString('pt-BR');

    if(d.horaIni && toMin(d.horaIni)<toMin('06:30')){
      alertas.push({chave:`horario:${data}:cedo`, icone:'&#9200;',
        texto:`No dia <b>${dataFmt}</b> você começou a digitar leitura muito cedo, às <b>${d.horaIni}</b>. Regularize a situação.`});
    }
    if(d.horaFim && toMin(d.horaFim)>toMin('18:00')){
      alertas.push({chave:`horario:${data}:tarde`, icone:'&#9200;',
        texto:`No dia <b>${dataFmt}</b> você digitou leitura muito tarde, às <b>${d.horaFim}</b>. Regularize a situação.`});
    }

    const todasHoras=[...new Set(d.todasHoras)].sort();
    let temIntervalo=false;
    for(let i=1;i<todasHoras.length;i++){
      if(toMin(todasHoras[i])-toMin(todasHoras[i-1])>=30){ temIntervalo=true; break; }
    }
    if(!temIntervalo){
      alertas.push({chave:`intervalo:${data}`, icone:'&#127869;',
        texto:`Na data <b>${dataFmt}</b> você não fez pausa para alimentação de no mínimo 30 minutos. Regularize a situação.`});
    }
  });
  return alertas;
}

async function carregarAlertas(){
  const [outros, horario] = await Promise.all([
    buscarAlertasErrosReclamacoes(),
    buscarAlertasHorarioIntervalo()
  ]);
  const todos=[...outros,...horario];

  const {data:lidos}=await sb.from('leiturista_alertas_lidos').select('alerta_chave').ilike('matricula',MATRICULA);
  const lidosSet=new Set((lidos||[]).map(l=>l.alerta_chave));

  ALERTAS_ATUAIS=todos.map(a=>({...a, lido:lidosSet.has(a.chave)}));
  atualizarBadgeAlertas(ALERTAS_ATUAIS.filter(a=>!a.lido).length);
}

function atualizarBadgeAlertas(qtd){
  const btn=document.getElementById('btn-alertas');
  const badge=document.getElementById('alertas-badge');
  const label=document.getElementById('alertas-label');
  if(qtd>0){
    btn.classList.add('tem-alerta');
    badge.textContent=qtd>9?'9+':qtd;
    badge.style.display='flex';
    label.classList.add('piscando');
  } else {
    btn.classList.remove('tem-alerta');
    badge.style.display='none';
    label.classList.remove('piscando');
  }
}

function renderAlertas(){
  const el=document.getElementById('conteudo-alertas');
  if(!ALERTAS_ATUAIS.length){
    el.className='status-msg';
    el.textContent='Nenhum alerta no momento. 🎉';
    return;
  }
  el.className='';
  el.innerHTML=`<div class="card">${ALERTAS_ATUAIS.map(a=>`
    <div class="alerta-item">
      <span class="alerta-icone">${a.icone}</span>
      <span class="alerta-texto">${a.texto}</span>
    </div>`).join('')}</div>`;
}

async function marcarAlertasComoLidos(){
  const novos=ALERTAS_ATUAIS.filter(a=>!a.lido);
  if(!novos.length) return;
  await sb.from('leiturista_alertas_lidos').upsert(
    novos.map(a=>({matricula:MATRICULA, alerta_chave:a.chave})),
    {onConflict:'matricula,alerta_chave'}
  );
  ALERTAS_ATUAIS.forEach(a=>a.lido=true);
  atualizarBadgeAlertas(0);
}

function abrirAlertas(){
  document.getElementById('tela-dashboard').style.display='none';
  document.getElementById('tela-alertas').style.display='block';
  renderAlertas();
  marcarAlertasComoLidos();
}
function fecharAlertas(){
  document.getElementById('tela-alertas').style.display='none';
  document.getElementById('tela-dashboard').style.display='block';
}

function mesesAtras(qtd){
  const lista=[];
  const hoje=new Date();
  for(let i=qtd-1;i>=0;i--){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
    const ref=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const label=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()];
    lista.push({ref,label});
  }
  return lista;
}

// ── Cabeçalho: saudação, nome, função/base, data/hora ───────────────────
function preencherCabecalho(nome, funcao, base){
  const hora=new Date().getHours();
  document.getElementById('saudacao').textContent = hora<12?'Bom dia!':(hora<18?'Boa tarde!':'Boa noite!');
  document.getElementById('topo-nome').textContent=nome;
  document.getElementById('topo-funcao-base').textContent=`${funcao||'Leiturista'} · ${base||'—'}`;
  document.getElementById('avatar').textContent=nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();

  const agora=new Date();
  document.getElementById('data-atual').textContent=agora.toLocaleDateString('pt-BR');
  document.getElementById('hora-atual').textContent=agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// ── Busca dos 4 indicadores do mês atual ────────────────────────────────
async function buscarIndicadoresDoMes(){
  const [jornadaRows, impRows, errRows, reclRows, totRzRows] = await Promise.all([
    sb.from('jornada').select('qtd_leituras,leituras_urbano,leituras_rural,leituras_povoado')
      .ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
    sb.from('impedimentos').select('ul,instalacao,endereco,ocorrencia')
      .ilike('matricula',MATRICULA).eq('mes_ref',MES_REF).ilike('responsabilidade','GBS'),
    sb.from('erros').select('ul,instalacao,cidade,mes_provavel')
      .ilike('matricula',MATRICULA).eq('mes_erro',MES_REF),
    sb.from('reclamacoes').select('instalacao,data,motivo')
      .ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
    sb.from('totais_rz').select('rz,total_leituras').ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
  ]);

  let leituras={total:0,urbano:0,rural:0,povoado:0};
  (jornadaRows.data||[]).forEach(r=>{
    leituras.total+=r.qtd_leituras||0;
    leituras.urbano+=r.leituras_urbano||0;
    leituras.rural+=r.leituras_rural||0;
    leituras.povoado+=r.leituras_povoado||0;
  });
  const rzDetalhe=(totRzRows.data||[]).slice().sort((a,b)=>(a.rz||'').localeCompare(b.rz||'',undefined,{numeric:true}));
  leituras.detalhe=rzDetalhe;
  // Fallback: mês sem linha em jornada com as colunas novas (upload antigo) -- soma o
  // total via totais_rz, mas a quebra urbano/rural/povoado fica em 0 (não existia ainda).
  if(!jornadaRows.data||!jornadaRows.data.length){
    leituras.total=rzDetalhe.reduce((s,r)=>s+(r.total_leituras||0),0);
  }

  const impDetalhe=impRows.data||[];
  const impostoBucket={urbano:0,rural:0,povoado:0};
  impDetalhe.forEach(r=>{ impostoBucket[bucketLeiturista(rotaDoUl(r.ul))]++; });
  const impedimentos={total:impDetalhe.length,urbano:impostoBucket.urbano,rural:impostoBucket.rural,povoado:impostoBucket.povoado,detalhe:impDetalhe};

  const errDetalhe=errRows.data||[];
  const erros={total:errDetalhe.length,detalhe:errDetalhe};

  const reclDetalhe=reclRows.data||[];
  const reclamacoes={total:reclDetalhe.length,detalhe:reclDetalhe};

  return {leituras,impedimentos,erros,reclamacoes};
}

// ── Histórico (6 meses) de um indicador — buscado só quando o Total é clicado ──
async function buscarHistorico(indicador){
  const meses=mesesAtras(6);
  if(indicador==='leituras'){
    const {data}=await sb.from('jornada').select('mes_ref,qtd_leituras')
      .ilike('matricula',MATRICULA).in('mes_ref',meses.map(m=>m.ref));
    const porMes={};
    (data||[]).forEach(r=>{ porMes[r.mes_ref]=(porMes[r.mes_ref]||0)+(r.qtd_leituras||0); });
    return {labels:meses.map(m=>m.label), valores:meses.map(m=>porMes[m.ref]||0)};
  }
  const tabela = indicador==='impedimentos' ? 'impedimentos' : (indicador==='erros' ? 'erros' : 'reclamacoes');
  const colMes = indicador==='erros' ? 'mes_erro' : 'mes_ref';
  const extra = indicador==='impedimentos' ? (q=>q.ilike('responsabilidade','GBS')) : (q=>q);
  const valores=await Promise.all(meses.map(async m=>{
    let q=sb.from(tabela).select('*',{count:'exact',head:true}).ilike('matricula',MATRICULA).eq(colMes,m.ref);
    q=extra(q);
    const {count}=await q;
    return count||0;
  }));
  return {labels:meses.map(m=>m.label), valores};
}

Chart.register(ChartDataLabels);

let chart=null;
function renderChart(labels, valores, cor, tituloTexto){
  document.getElementById('chart-titulo-valor').textContent=tituloTexto;
  const ctx=document.getElementById('chart-hist').getContext('2d');
  if(chart){ chart.data.labels=labels; chart.data.datasets[0].data=valores; chart.data.datasets[0].backgroundColor=cor; chart.update(); return; }
  chart=new Chart(ctx,{
    type:'bar',
    data:{labels, datasets:[{data:valores, backgroundColor:cor, borderRadius:4, maxBarThickness:28}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:18}},
      plugins:{
        legend:{display:false},
        datalabels:{anchor:'end', align:'top', color:'#5a7a5a', font:{size:11,weight:'500'}, formatter:v=>v.toLocaleString('pt-BR')}
      },
      scales:{
        y:{beginAtZero:true, ticks:{font:{size:10}}},
        x:{ticks:{font:{size:11}}, grid:{display:false}}
      }
    }
  });
}

function marcarSelecionado(elClicado){
  document.querySelectorAll('.tile.clicavel').forEach(t=>t.classList.remove('sel'));
  elClicado.classList.add('sel');
}

async function aoClicarTotal(indicador, cor, tituloTexto, elClicado){
  marcarSelecionado(elClicado);
  document.getElementById('chart-titulo-valor').textContent='Carregando...';
  const {labels,valores}=await buscarHistorico(indicador);
  renderChart(labels, valores, cor, tituloTexto);
}

function toggleLista(catId){
  const wrap=document.getElementById('tabela-'+catId);

  btn.querySelector('.lbl').textContent=aberto?'Toque para ver':'Ocultar';
  btn.querySelector('.chev').style.transform=aberto?'rotate(0deg)':'rotate(90deg)';
}

function tileHtml(key, valor, label, cor, clicavel, tituloChart){
  const onclick = clicavel ? `onclick="aoClicarTotal('${key}','${cor}','${tituloChart}',this)"` : '';

    <p class="tile-num" style="color:${cor}">${valor.toLocaleString('pt-BR')}</p>
    <p class="tile-lbl">${label}</p>
  </div>`;
}

const CORES_NIVEL={bronze:'#ad6f3b',prata:'#a8a8b0',ouro:'#ef9f27',platina:'#8fb4c9'};
const NOME_NIVEL={bronze:'Bronze',prata:'Prata',ouro:'Ouro',platina:'Platina'};
const POSICOES=[0,33.3,66.7,100];
const COR_STATUS={ruim:'#c0392b',bom:'#2f9e5c'};
function corDaBarra(nivel){ return nivel==='bronze'?COR_STATUS.ruim:COR_STATUS.bom; }

function medalhaSvg(cor){
  return `<svg width="20" height="20" viewBox="0 0 20 20" style="display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))">
    <circle cx="10" cy="10" r="9" fill="${cor}" stroke="rgba(0,0,0,.15)" stroke-width="0.5"/>
    <circle cx="7.4" cy="6.8" r="3" fill="rgba(255,255,255,.32)"/>
    <path d="M10 5.3l1.02 2.07 2.28.33-1.65 1.61.39 2.27L10 10.47l-2.04 1.14.39-2.27-1.65-1.61 2.28-.33z" fill="rgba(255,255,255,.92)"/>
  </svg>`;
}

const DEFAULTS_CORTES={
  leitura:{prata:7500,ouro:9000,platina:10500},
  impedimento:{prata:99.50,ouro:99.60,platina:99.70},
  erro:{prata:99.90,ouro:99.98,platina:100},
  reclamacao:{prata:99.90,ouro:99.98,platina:100},
};

function montarMetricas(cfg){
  const c=cfg||{};
  const cortesDe=chave=>({
    bronze:0,
    prata:c[`${chave}_prata`]??DEFAULTS_CORTES[chave].prata,
    ouro:c[`${chave}_ouro`]??DEFAULTS_CORTES[chave].ouro,
    platina:c[`${chave}_platina`]??DEFAULTS_CORTES[chave].platina,
  });
  return [
    {chave:'leitura',     titulo:'Leituras',      formatoPct:false, cortes:cortesDe('leitura')},
    {chave:'impedimento', titulo:'Impedimentos',  formatoPct:true,  cortes:cortesDe('impedimento')},
    {chave:'erro',        titulo:'Erros',         formatoPct:true,  cortes:cortesDe('erro')},
    {chave:'reclamacao',  titulo:'Reclamações',   formatoPct:true,  cortes:cortesDe('reclamacao')},
  ];
}

function nivelDoValor(valor,cortes){
  if(valor>=cortes.platina) return 'platina';
  if(valor>=cortes.ouro) return 'ouro';
  if(valor>=cortes.prata) return 'prata';
  return 'bronze';
}

function posicaoNaBarra(valor,cortes){
  const niveis=['bronze','prata','ouro','platina'];
  const c=niveis.map(n=>cortes[n]);
  for(let i=0;i<3;i++){
    if(valor<c[i+1]){
      const frac=Math.max(0,Math.min(1,(valor-c[i])/(c[i+1]-c[i])));
      return POSICOES[i]+frac*(POSICOES[i+1]-POSICOES[i]);
    }
  }
  return 100;
}

async function carregarPremiacao(){
  const [totaisRz,impCount,errCount,reclCount,histNivel,niveisCfg]=await Promise.all([
    sb.from('totais_rz').select('total_leituras').ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
    sb.from('impedimentos').select('*',{count:'exact',head:true}).ilike('matricula',MATRICULA).eq('mes_ref',MES_REF).ilike('responsabilidade','GBS'),
    sb.from('erros').select('*',{count:'exact',head:true}).ilike('matricula',MATRICULA).eq('mes_erro',MES_REF),
    sb.from('reclamacoes').select('*',{count:'exact',head:true}).ilike('matricula',MATRICULA).eq('mes_ref',MES_REF),
    sb.from('niveis_historico').select('nivel,valor,mes_ref').ilike('matricula',MATRICULA).order('mes_ref',{ascending:false}).limit(1).maybeSingle(),
    sb.from('leiturista_niveis_config').select('*').eq('id',1).maybeSingle()
  ]);
  const METRICAS=montarMetricas(niveisCfg.data);

  let leituras=(totaisRz.data||[]).reduce((s,r)=>s+(r.total_leituras||0),0);
  if(!totaisRz.data||!totaisRz.data.length){
    const {data:jornadaRows}=await sb.from('jornada').select('qtd_leituras').ilike('matricula',MATRICULA).eq('mes_ref',MES_REF);
    leituras=(jornadaRows||[]).reduce((s,r)=>s+(r.qtd_leituras||0),0);
  }
  const qtdImp=impCount.count||0;
  const qtdErr=errCount.count||0;
  const qtdRecl=reclCount.count||0;

  const valores={};
  if(leituras>0){
    valores.leitura=leituras;
    valores.impedimento=100-(qtdImp/leituras*100);
    valores.erro=100-((qtdErr*10000/leituras)/100);
    valores.reclamacao=100-((qtdRecl*10000/leituras)/100);
  } else {
    valores.leitura=0; valores.impedimento=0; valores.erro=0; valores.reclamacao=0;
  }

  const nivelOficial=histNivel.data?.nivel||'bronze';
  const beneficioOficial=histNivel.data?.valor??0;
  const cor=CORES_NIVEL[nivelOficial];

  let html=`
    <div class="card">
      <div class="nivel-box" style="background:${cor}22">
        <p style="color:${cor}">Você está no nível <span style="font-weight:500">${NOME_NIVEL[nivelOficial]}</span></p>
        <p style="color:${cor}">Seu benefício <span style="font-weight:500">R$ ${beneficioOficial.toFixed(2).replace('.',',')}</span></p>
      </div>
      <p class="mes-titulo">Mês em andamento — ${nomeMesAtual()}</p>
      <p class="mes-sub">Faça mais leituras, melhore seus indicadores para subir de nível.</p>
  `;

  const qtdBruta={impedimento:qtdImp,erro:qtdErr,reclamacao:qtdRecl};

  METRICAS.forEach(m=>{
    const valor=valores[m.chave];
    const pos=posicaoNaBarra(valor,m.cortes);
    const nivelAtual=nivelDoValor(valor,m.cortes);
    const fmt=v=>m.formatoPct?v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':Math.round(v).toLocaleString('pt-BR');
    const sufixo=m.formatoPct?` <span class="bar-qtd">(${qtdBruta[m.chave]} no mês)</span>`:'';
    html+=`
      <div class="bar-linha">
        <p><span class="bar-valor">${fmt(valor)}</span> <span class="bar-label">${m.titulo}</span>${sufixo}</p>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pos}%;background:${corDaBarra(nivelAtual)}"></div>
          <div class="bar-medalha" style="left:0%">${medalhaSvg(CORES_NIVEL.bronze)}</div>
          <div class="bar-medalha" style="left:33.3%">${medalhaSvg(CORES_NIVEL.prata)}</div>
          <div class="bar-medalha" style="left:66.7%">${medalhaSvg(CORES_NIVEL.ouro)}</div>
          <div class="bar-medalha" style="left:100%">${medalhaSvg(CORES_NIVEL.platina)}</div>
          <div class="bar-num" style="left:0%">${fmt(m.cortes.bronze)}</div>
          <div class="bar-num" style="left:33.3%">${fmt(m.cortes.prata)}</div>
          <div class="bar-num" style="left:66.7%">${fmt(m.cortes.ouro)}</div>
          <div class="bar-num" style="left:100%">${fmt(m.cortes.platina)}</div>
        </div>
      </div>`;
  });

  html+='</div>';
  document.getElementById('conteudo-premiacao').innerHTML=html;
  document.getElementById('conteudo-premiacao').className='';
}
